
[experiment]
name = "a8_smoke"
num_sensors = [100]
seeds = [1]

[topology]
area_m = 500.0
sensor_range_m = 80.0
dbscan_kappa = 0.8
dbscan_min_samples = 3
uav_range_m = 30.0
alpha = 0.5
min_candidates = 2
depot_x = 0.0
depot_y = 0.0

[simulation]
simTime = 600.0
routing = "tour"
initialEnergy = 500.0
readingRate = 0.1
uavSpeed = 10.0
uavSpeedStd = 1.0
dutyPeriod = 10.0
dutyListen = 1.0
wakeMode = "scheduled"
wakeHalfWidth = 20.0
uavDelayProb = 0.1
uavDelayMin = 10.0
uavDelayMax = 30.0
wDrift = 0.0
heartbeatInterval = 1.0
missedHeartbeats = 3
enableBackupCH = true
failoverOnMissedMeeting = true

[[variant]]
name = "a8_missed_meeting"
chFailureRate = 0.0

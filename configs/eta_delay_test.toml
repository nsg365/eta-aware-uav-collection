[experiment]
name = "eta_delay_test"
num_sensors = [100]
seeds = [1]

[topology]
area_m = 500.0
sensor_range_m = 80.0
dbscan_kappa = 0.8
dbscan_min_samples = 3
uav_range_m = 30.0
alpha = 0.5
